{% extends "base.html" %}

{% block content %}
<div class="card">
    <p><a href="{{ url_for('catalog.departments') }}" class="back-link">← {{ _('Todas las categorías') }}</a></p>
    <h2>{{ department.name }}</h2>
    <p>{{ _('Seleccioná una subcategoría para explorar artículos:') }}</p>
    <div class="grid catalog-grid">
        {% for sub in subcategories %}
        <div class="card card-inset">
            <h3 class="card-inset-title">
                <a href="{{ url_for('catalog.subcategory_view', slug=sub.slug) }}" class="card-inset-link">
                    {{ sub.name }}
                </a>
            </h3>
            <a href="{{ url_for('catalog.subcategory_view', slug=sub.slug) }}" class="btn btn-sm">
                {{ _('Ver productos →') }}
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
