{% extends "base.html" %}

{% block title %}Iniciar Sesión — Sur en Precios{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="card">
        <h2 class="auth-title">Iniciar Sesión</h2>
        <p class="auth-subtitle">
            Acceda a sus canastas de compras personales y optimizaciones.
        </p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if next_url %}
                <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}

            <div class="form-group">
                <label for="username" class="field-label">
                    Nombre de Usuario
                </label>
                <input type="text" id="username" name="username" value="{{ username }}" required autofocus autocomplete="username" placeholder="ej. usuario123">
            </div>

            <div class="form-group form-group-spaced">
                <label for="password" class="field-label">
                    Contraseña
                </label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn btn-success auth-submit">
                Ingresar al Sistema
            </button>
        </form>

        <div class="auth-footer">
            <span>¿No tienes una cuenta?</span>
            <a href="{{ url_for('auth.register') }}" class="auth-footer-link">Registrarse aquí</a>
        </div>
    </div>
</div>
{% endblock %}
