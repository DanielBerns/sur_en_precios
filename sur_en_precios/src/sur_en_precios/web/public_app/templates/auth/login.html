{% extends "base.html" %}

{% block title %}Iniciar Sesión — Sur en Precios{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <h2 style="color: var(--accent); margin-top: 0; text-align: center;">Iniciar Sesión</h2>
        <p style="color: #a0aec0; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">
            Acceda a sus canastas de compras personales y optimizaciones.
        </p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if next_url %}
                <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}

            <div class="form-group">
                <label for="username" style="display: block; margin-bottom: 0.4rem; font-weight: bold;">
                    Nombre de Usuario
                </label>
                <input type="text" id="username" name="username" value="{{ username }}" required autofocus autocomplete="username" placeholder="ej. usuario123">
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="password" style="display: block; margin-bottom: 0.4rem; font-weight: bold;">
                    Contraseña
                </label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 1.5rem; padding: 0.75rem;">
                Ingresar al Sistema
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid #3a506b; padding-top: 1rem; font-size: 0.9rem;">
            <span>¿No tienes una cuenta?</span>
            <a href="{{ url_for('auth.register') }}" style="color: var(--accent); margin-left: 0.4rem; font-weight: bold;">Registrarse aquí</a>
        </div>
    </div>
</div>
{% endblock %}
